<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Efes Чок</title>

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Основные стили -->
  <link rel="stylesheet" href="style.css">
</head>

<!-- Стартуем с темы EFES -->
<body class="theme-efes">
    <main class="app-shell">
    <section class="card">
      <header class="card-header">
        <div class="title-group">
          <p class="brand-tag">Efes Club Card</p>
          <h1>Чок!</h1>
        </div>
        <button class="chip" id="editBtn" type="button">Анкета</button>
      </header>

      <section class="card-status">
        <h2 id="username">Загрузка...</h2>
        <p id="status" class="status-line">Нажми «Чок!» и встряхни телефон</p>
        <p id="partner" class="partner-line"></p>
        <div id="shakeTimer" class="shake-timer" hidden>
          <span class="timer-label">Осталось</span>
          <span id="shakeCountdown" class="timer-value">10</span>
          <span class="timer-label">сек</span>
        </div>
      </section>

      <section class="card-gamify" aria-live="polite">
        <div class="level-chip">
          <span id="levelLabel" class="level-rank">LVL 1</span>
          <span id="titleLabel" class="level-title">Новичок</span>
        </div>
        <div class="xp-track">
          <div class="xp-head">
            <span id="xpLabel">0 / 100 XP</span>
            <span id="streakLabel" class="streak">🔥 0</span>
          </div>
          <div class="xp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="xpFill" class="xp-fill"></div>
          </div>
        </div>
        <ul id="questList" class="quest-board"></ul>
      </section>

      <section class="card-bottle">
        <div id="bottleWrap" class="bottle-wrap">
          <div
            id="bottle"
            class="bottle-img bottle-visual visual--bottle bottle--efes"
            role="img"
            aria-live="polite"
            aria-label="Пиксельная бутылочка Efes"
          ></div>
          <div id="cap" class="cap" aria-hidden="true"></div>
          <div id="foam" class="foam" aria-hidden="true"></div>
        </div>
        <button class="btn primary" id="shakeBtn" title="1) Нажми, 2) Тряси телефон">Чок!</button>
      </section>

      <section id="designSection" class="card-section">
        <div class="section-head">
          <h3>Дизайн бутылочки</h3>
          <button class="chip" id="saveDesignBtn" type="button">Сохранить</button>
        </div>
        <div id="designOptions" class="design-grid">
          <button class="design-card design-card--efes" data-design="efes" type="button">
            <span class="design-icon bottle-visual visual--bottle bottle--efes" aria-hidden="true"></span>
            <span class="design-label">Efes</span>
          </button>
          <button class="design-card design-card--miller" data-design="miller" type="button">
            <span class="design-icon bottle-visual visual--bottle bottle--miller" aria-hidden="true"></span>
            <span class="design-label">Miller</span>
          </button>
          <button class="design-card design-card--ruzka" data-design="ruzka" type="button">
            <span class="design-icon bottle-visual visual--mug mug--ruzka" aria-hidden="true"></span>
            <span class="design-label">Кружка свежего</span>
          </button>
          <button class="design-card design-card--medved" data-design="medved" type="button">
            <span class="design-icon bottle-visual visual--bottle bottle--medved" aria-hidden="true"></span>
            <span class="design-label">Белый медведь</span>
          </button>
        </div>
      </section>

      <section id="editBlock" class="card-section profile-block" data-state="collapsed">
        <h3>Анкета</h3>
        <label class="field field--name">
          <span>Имя</span>
          <input id="nameInput" type="text" placeholder="Как тебя зовут?" required>
        </label>
        <label class="field field--age">
          <span>Возраст (21+)</span>
          <input id="ageInput" type="number" min="21" max="120" placeholder="21" required>
        </label>
        <label class="field field--mood">
          <span>Настроение</span>
          <input id="moodInput" type="text" placeholder="Весёлое / Чилл / ..." required>
        </label>
        <label class="field field--contact">
          <span>Контакт</span>
          <input id="contactInput" type="text" placeholder="@nickname" required>
        </label>
        <div class="edit-actions">
          <button class="btn primary" id="saveProfileBtn" type="button">Сохранить</button>
          <button class="btn ghost" id="cancelEditBtn" type="button">Отменить</button>
        </div>
      </section>

      <section class="card-section compact">
        <div class="section-head">
          <h3>Тема</h3>
          <select id="themeSel">
            <option value="efes">EFES</option>
            <option value="miller">Miller</option>
            <option value="ruzka">Кружка свежего</option>
            <option value="medved">Белый медведь</option>
          </select>
        </div>
      </section>

      <section id="historyBox" class="card-section">
        <h3>История</h3>
        <ul id="historyList"></ul>
      </section>

      <footer class="card-footer">
        <div class="action-row">
          <button class="btn ghost" id="friendsBtn" type="button">Мои знакомства</button>
        </div>
        <button class="btn ghost" id="fillInChatBtn" type="button" style="display:none;">Заполнить в чате</button>
      </footer>
    </section>
   <button id="openFromBotBtn" class="bot-entry" type="button" style="display:none;">
      Открыть мини-апп из бота
    </button>
     </main>

  <!-- Адрес backend и имя бота (как было) -->
  <script>
    window.__API_BASE__ = 'https://efes-app.onrender.com';
    window.__BOT_USERNAME__ = 'EfesConnectBot';
  </script>

  <!-- Звуки -->
  <audio id="sfx-bottle" preload="auto">
    <source src="bottle_open.mp3" type="audio/mpeg">
  </audio>
  
  <!-- Твой основной скрипт -->
  <script src="/script2.js" defer></script>
  <!-- Безопасный помощник: показать fallback-кнопку вне Telegram -->
  <script>
    (function() {
       document.addEventListener('DOMContentLoaded', function () {
               const fallback = document.getElementById('openFromBotBtn');
        if (!window.Telegram?.WebApp && fallback) {
          fallback.style.display = 'block';
        }
      });
    })();
  </script>
</body>
</html>
